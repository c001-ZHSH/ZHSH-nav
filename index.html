<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3ED">
<meta name="description" content="選擇出發點與目的地，查看在中和高中校內怎麼走到教室與處室。">
<meta property="og:title" content="中和高中校內導航">
<meta property="og:description" content="選擇出發點與目的地，查看在中和高中校內怎麼走到教室與處室。">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Condensed:wght@600;700&display=swap">
<title>中和高中校內導航</title>
<style>
  :root{color-scheme:light}
  html,body{margin:0}
  body{font:14px/1.5 system-ui,sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<style>

:root{
  --ink:#14273D; --ink-soft:#4A5B71; --paper:#F6F3ED; --panel:#FFFFFF;
  --line:#DCD5C8; --field:#EDE7DB; --route:#1D5FD6; --mark:#BE3A2B;
  --bldg:#C8CFD6; --room:#DCE4EC; --wc:#DAE8DA; --vert:#F2E2B8;
  --gate:#E8C48A; --shadow:rgba(20,39,61,.10);
  --on-route:#FFFFFF;
  --v-tread:#CFE0FA; --v-riser:#7FA6E6; --v-side:#5C88D2; --v-edge:#1D4FAE;
  color-scheme:light;
}
/* 深色模式：由頁面右上角按鈕切換（class 加在 <html> 上） */
:root.theme-dark{
  --ink:#E7E3DA; --ink-soft:#9AA6B4; --paper:#111A24; --panel:#18232F;
  --line:#2C3A48; --field:#1B2731; --route:#5EA8FF; --mark:#F0685A;
  --bldg:#38434F; --room:#2A3845; --wc:#2C4034; --vert:#453A20;
  --gate:#54401F; --shadow:rgba(0,0,0,.45);
  --on-route:#0B1624;
  --v-tread:#9CC8FF; --v-riser:#5A8FD6; --v-side:#3F6FB4; --v-edge:#0E2440;
  color-scheme:dark;
}
body{background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
.wrap{max-width:460px;margin:0 auto;padding:0 0 56px}
.demo-bar{background:#5C7C8A;color:#fff;font-size:13px;line-height:1.5;
  padding:9px 18px;text-align:center}
.demo-bar b{font-weight:700}
.masthead{padding:12px 18px 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.school{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--ink-soft);order:2}
.occasion{font-size:19px;font-weight:900;margin:0;order:1}
.themebtn{order:3;margin-left:auto;align-self:center;display:inline-flex;align-items:center;gap:5px;
  font-family:inherit;font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px}
.themebtn svg{width:14px;height:14px}
.themebtn:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.occasion .sub{font-size:14px;font-weight:500;color:var(--ink-soft);margin-left:8px}
.origin button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sec-label .no{width:23px;height:23px;border-radius:50%;background:var(--ink);
  color:var(--paper);display:grid;place-items:center;
  font-family:"Barlow Condensed",sans-serif;font-size:15px;font-weight:700}
/* ── 建築量體：頂面亮、南面中、東面暗，模擬左上方來的光 ── */
:root{
  --m-ground:#E9E4D9; --m-top:#FBFAF6; --m-south:#DAD4C8; --m-east:#C3BCAE;
  --m-edge:#8D877B;   --m-line:#B3AC9E;
  --m-tgt-top:#FCE8CC; --m-tgt-south:#F1D2A6; --m-tgt-east:#DFBA88;
  --m-road:#BAB5AC; --m-road-line:#FFFFFF; --m-road-text:#FFFFFF; --m-plaza:#F4EFE4;
}
:root.theme-dark{
  --m-ground:#18222C; --m-top:#3B4756; --m-south:#2D3946; --m-east:#232E3A;
  --m-edge:#5A6A7E;   --m-line:#475669;
  --m-tgt-top:#5C4727; --m-tgt-south:#4A3920; --m-tgt-east:#3A2D19;
  --m-road:#0C131A; --m-road-line:#5E6E80; --m-road-text:#7F8EA0; --m-plaza:#243241;
}
.m-ground{fill:var(--m-ground)}
.m-top{stroke:none}
.m-side{stroke:var(--m-edge);stroke-width:.6;stroke-linejoin:round}
.m-roofline{fill:none;stroke:var(--m-edge);stroke-width:.9;stroke-linecap:round}
.m-top.m-std{fill:var(--m-top)}
.m-south.m-std{fill:var(--m-south)}
.m-east.m-std{fill:var(--m-east)}
.m-top.m-tgt{fill:var(--m-tgt-top)}
.m-south.m-tgt{fill:var(--m-tgt-south)}
.m-east.m-tgt{fill:var(--m-tgt-east)}
.m-floorline{stroke:var(--m-line);stroke-width:.6}
.m-name{font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:700;
  fill:var(--ink-soft);paint-order:stroke;stroke:var(--m-top);stroke-width:3px}
.m-name-tgt{fill:var(--mark);font-weight:900;stroke:var(--m-tgt-top)}
.m-floors{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  fill:var(--ink-soft);opacity:.75}
.m-route{fill:none;stroke:var(--route);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.m-rise{stroke:var(--route);stroke-width:3.4;stroke-dasharray:4 3;stroke-linecap:round}
/* 擋在目的地前面的大樓：面變半透明，但外框線保留，還看得出建築輪廓 */
.m-ghost polygon{fill-opacity:.45}
.m-ghost .m-side{stroke-width:.9}
.m-ghost .m-roofline{stroke-width:1.2}
.m-ghost .m-floorline{opacity:.55}
.m-road{fill:var(--m-road)}
.m-road-edge{stroke:var(--m-road-line);stroke-width:1;opacity:.8}
.m-road-mid{stroke:var(--m-road-line);stroke-width:1.2;stroke-dasharray:9 7}
.m-road-name{font-family:'Noto Sans TC',sans-serif;font-size:15px;font-weight:900;letter-spacing:.5em;fill:var(--m-road-text)}
.m-plaza{fill:var(--m-plaza);stroke:var(--m-edge);stroke-width:.6;stroke-dasharray:3 2}
.m-top.m-gate{fill:var(--m-top)}
.m-south.m-gate{fill:var(--m-south)}
.m-east.m-gate{fill:var(--m-east)}
/* 樓梯間、電梯井 */
.v-floor{fill:var(--route);fill-opacity:.10}
.v-back{stroke:var(--route);stroke-width:.8;stroke-dasharray:2 2;opacity:.55}
.v-level{fill:none;stroke:var(--route);stroke-width:.7;opacity:.45}
.v-glass{fill:var(--route);fill-opacity:.07;stroke:var(--route);stroke-width:1;stroke-opacity:.75;stroke-linejoin:round}
.v-glass-top{fill:var(--route);fill-opacity:.05;stroke:var(--route);stroke-width:1;stroke-opacity:.75;stroke-linejoin:round}
.v-step,.v-landing,.v-car{stroke:var(--v-edge);stroke-width:.45;stroke-linejoin:round}
.v-step.v-top,.v-landing.v-top{fill:var(--v-tread)}
.v-step.v-south,.v-landing.v-south{fill:var(--v-riser)}
.v-step.v-east,.v-landing.v-east{fill:var(--v-side)}
.v-car.v-top{fill:var(--route)}
.v-car.v-south{fill:var(--route);filter:brightness(.8)}
.v-car.v-east{fill:var(--route);filter:brightness(.62)}
.v-door{stroke:var(--panel);stroke-width:.8;opacity:.9}
.rline,.m-route,.m-rise{filter:drop-shadow(0 0 1.3px var(--panel)) drop-shadow(0 0 .6px var(--panel))}
.m-dest-t{fill:var(--mark)}
.m-dest-edge{fill:none;stroke:var(--mark);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.m-dest-s{fill:var(--mark);filter:brightness(.82)}
.m-dest-e{fill:var(--mark);filter:brightness(.66)}
.routehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:11px 14px;background:var(--field);border-radius:11px;font-size:15px}
.routehead .rh-lb{font-size:11px;font-weight:700;letter-spacing:.12em;
  color:var(--ink-soft);opacity:.8}
.routehead .rh-from{font-weight:700;color:var(--ink)}
.routehead .rh-ar{color:var(--route);font-weight:900;font-size:17px}
.routehead .rh-to{font-weight:900;color:var(--mark)}
.search{padding:0 18px;display:flex;flex-direction:column;gap:10px}
.suggest .n{font-weight:700}
.suggest .l{font-size:13px;color:var(--ink-soft);white-space:nowrap}
.viewctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:2px 18px 0;padding:0}
.ctlrow{display:flex;align-items:center;gap:4px}
.viewctl button:disabled{opacity:.34;cursor:default}
.viewctl .vl{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink-soft);margin-right:3px;white-space:nowrap}
.viewctl button{font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;
  border:1px solid var(--line);border-radius:7px;padding:4px 9px;line-height:1.4;
  background:transparent;color:var(--ink-soft);white-space:nowrap}
.viewctl button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.viewctl button:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.viewctl .spin{margin-left:auto;font-family:"Barlow Condensed",sans-serif;font-size:15px}
.result{padding:12px 18px 0;display:flex;flex-direction:column;gap:10px}
.dest{display:flex;gap:11px;border-left:4px solid var(--mark);padding-left:11px;align-items:center}
.dest-num{font-family:"Barlow Condensed",sans-serif;font-size:38px;font-weight:700;
  line-height:.9;color:var(--mark);font-variant-numeric:tabular-nums}
.dest-txt{display:flex;flex-direction:column;gap:1px}
.dest-name{font-size:17px;font-weight:900;line-height:1.2}
.dest-where{font-size:12.5px;font-weight:500;color:var(--ink-soft)}
.vstep{display:flex;align-items:center;gap:9px;padding:9px 12px;
  background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--route);
  border-radius:10px}
.vstep svg{width:20px;height:20px;color:var(--route);flex-shrink:0}
.vstep .vtext{font-size:15px;font-weight:700}
.vstep .vtext b{font-size:17px;font-weight:900;color:var(--route)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;box-shadow:0 1px 3px var(--shadow)}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 11px;border-bottom:1px solid var(--line)}
.stage-n{font-family:"Barlow Condensed",sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.12em;color:var(--route)}
.stage-t{font-size:12.5px;font-weight:700;flex:1 1 auto;min-width:0;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zoombtn{font-family:inherit;font-size:11.5px;font-weight:700;white-space:nowrap;
  color:var(--ink);background:transparent;border:1px solid var(--line);
  border-radius:6px;padding:3px 8px;cursor:pointer}
.zoombtn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.zoombtn:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.mapbox{display:flex;justify-content:center;background:var(--field);
  overflow:auto;-webkit-overflow-scrolling:touch}
.mapbox svg{max-width:100%;max-height:56vh;width:auto;height:auto}
.mapbox.zoom svg{max-width:none;max-height:none;width:200%;height:auto}
.stage svg{display:block}
.steps .d{font-family:"Barlow Condensed",sans-serif;font-size:14px;font-weight:700;
  width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
  background:var(--route);color:var(--on-route);margin-top:1px}
.steps li:last-child .d{background:var(--mark);color:#fff}
.steps .t{font-size:15.5px;line-height:1.55}
.steps .t em{font-style:normal;font-weight:700}
.desthi{fill-opacity:.42}
@media (prefers-reduced-motion:no-preference){
  .desthi{animation:destpulse 1.7s ease-in-out infinite}
@keyframes destpulse{0%,100%{fill-opacity:.20}
50%{fill-opacity:.60}
}
.rline{stroke-dasharray:7 6;animation:flow 1.15s linear infinite}
@keyframes flow{to{stroke-dashoffset:-13}
}
.pulse{animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.28;r:11}
50%{opacity:0;r:20}
}
}
/* ── 出發點／目的地，兩塊格式完全一樣 ── */
.picker{margin:0 18px 8px;padding:9px 11px 10px;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;
  display:flex;flex-direction:column;gap:7px;min-width:0;overflow:hidden}
.picker .phead{display:flex;align-items:center;gap:7px;min-height:20px}
.picker .pno{width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--paper);
  display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;
  font-size:12px;font-weight:700;flex-shrink:0}
.picker .ptitle{font-size:13.5px;font-weight:900;white-space:nowrap}
.picker .pnow{margin-left:auto;font-size:13px;font-weight:700;color:var(--route);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pfield{position:relative;display:flex;width:100%;min-width:0}
.pfield input{flex:1 1 auto;min-width:0;width:100%;
  font-family:inherit;font-size:16px;font-weight:500;color:var(--ink);
  background:var(--field);border:1.5px solid var(--line);border-radius:9px;
  padding:7px 11px 7px 33px;outline:none;line-height:1.3}
.pfield input::placeholder{color:var(--ink-soft);font-weight:400}
.pfield input:focus{border-color:var(--route);background:var(--panel)}
.pfield svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;color:var(--ink-soft);pointer-events:none}
.pchips{display:flex;flex-wrap:wrap;gap:5px}
.pchips button{font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;
  border:1px solid var(--line);border-radius:999px;padding:3px 9px;line-height:1.5;
  background:transparent;color:var(--ink-soft);max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchips button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.pchips button:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.plist{list-style:none;margin:0;padding:0;border:1.5px solid var(--line);
  border-radius:9px;overflow:hidden;background:var(--panel)}
.plist li{padding:7px 11px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;
  align-items:baseline;gap:10px;border-top:1px solid var(--line);min-width:0}
.plist .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist li:first-child{border-top:none}
.plist li:hover{background:color-mix(in srgb,var(--route) 12%,transparent)}
.plist .pn{font-weight:700}
.plist .pl{font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
.pnone{padding:11px 13px;font-size:13.5px;color:var(--ink-soft)}</style>

<div class="wrap">

  <header class="masthead">
    <div class="school">新北市立中和高級中學</div>
    <h1 class="occasion">校內導航</h1>
    <button class="themebtn" id="themeBtn" type="button" aria-label="切換深色／淺色"></button>
  </header>

  <div class="picker" id="pickFrom"></div>
  <div class="picker" id="pickTo"></div>
  <div class="viewctl" id="viewctl"></div>
  <main class="result" id="result"></main>
</div>

,58,50,77]],"alias":[],"kind":"處室／專科"},{"key":"團輔室@5F","label":"團輔室","name":"團輔室","bldg":"通達樓","floor":5,"grid":"室內5F","refs":["BO11:BY16"],"rects":[[11,67,16,77]],"alias":[],"kind":"處室／專科"},{"key":"儲藏室@6F","label":"儲藏室","name":"儲藏室","bldg":"行政大樓","floor":6,"grid":"室內6F","refs":["BB39:BE43"],"rects":[[39,54,43,57]],"alias":[],"kind":"處室／專科"},{"key":"行政大樓六樓會議室@6F","label":"行政大樓六樓會議室","name":"行政大樓六樓會議室","bldg":"行政大樓","floor":6,"grid":"室內6F","refs":["BF33:BY50"],"rects":[[33,58,50,77]],"alias":[],"kind":"處室／專科"},{"key":"儲藏室@7F","label":"儲藏室","name":"儲藏室","bldg":"行政大樓","floor":7,"grid":"室內7F","refs":["BB39:BE43"],"rects":[[39,54,43,57]],"alias":[],"kind":"處室／專科"},{"key":"行政大樓七樓桌球室@7F","label":"行政大樓七樓桌球室","name":"行政大樓七樓桌球室","bldg":"行政大樓","floor":7,"grid":"室內7F","refs":["BF33:BY50"],"rects":[[33,58,50,77]],"alias":[],"kind":"處室／專科"},{"key":"活動中心@1F","label":"活動中心","name":"活動中心","bldg":"活動中心","floor":1,"grid":"base","refs":["AX83:CB105"],"rects":[[83,50,105,80]],"alias":[],"kind":"場館"},{"key":"圖書館@1F","label":"圖書館","name":"圖書館","bldg":"圖書館","floor":1,"grid":"base","refs":["R69:AO86"],"rects":[[69,18,86,41]],"alias":[],"kind":"場館"},{"key":"校門口@1F","label":"校門口","name":"校門口","bldg":"校門口","floor":1,"grid":"base","refs":["CH58:CM73"],"rects":[[58,86,73,91]],"alias":["大門","正門"],"kind":"場館","gate":true}],"starts":[{"id":"gate","key":"校門口@1F","name":"校門口"},{"id":"hall","key":"活動中心@1F","name":"活動中心"},{"id":"self5","key":"自主學習空間@5F","name":"行政 5F 自主學習空間"},{"id":"meet6","key":"行政大樓六樓會議室@6F","name":"行政 6F 會議室"}],"baseGrid":"base","floors":[1,2,3,4,5,6,7],"gridFloor":{"base":1,"室內2F":2,"室內3F":3,"室內4F":4,"室內5F":5,"室內6F":6,"室內7F":7}};

/* 校園路徑計算：把 build.py 的邏輯搬到瀏覽器，任意起點都能即時算 */
const TURN_COST = 2.5, OUTDOOR_COST = 3.0;

function makeRouter(D){
  const K  = (r,c) => (r << 8) | c;          // 欄最多 255，夠用
  const KR = k => k >> 8, KC = k => k & 255;

  /* 建築區域：RLE 展開 */
  const BUILD = {}, INDOOR = new Set();
  for(const [name, runs] of Object.entries(D.build)){
    const s = new Set();
    for(const [r, a, b] of runs) for(let c = a; c <= b; c++){ s.add(K(r,c)); INDOOR.add(K(r,c)); }
    BUILD[name] = s;
  }

  const G = {};
  for(const [key, g] of Object.entries(D.grids)){
    const walk = new Set(g.walk);
    const occ = new Map();                    // 可通行判斷用（放行沒填字與可穿越）
    const occAll = new Map();                 // 判斷「在哪個區塊裡」用
    g.blocks.forEach((b, i)=>{
      for(let r = b.r1; r <= b.r2; r++) for(let c = b.c1; c <= b.c2; c++){
        occAll.set(K(r,c), i);
        if(b.label && !walk.has(b.ref)) occ.set(K(r,c), i);
      }
    });
    if(key === D.baseGrid){                   // 校門口是通道不是障礙
      const gate = g.blocks.find(b => b.label === '校門口');
      if(gate) for(let r = gate.r1; r <= gate.r2; r++)
        for(let c = gate.c1; c <= gate.c2; c++) occ.delete(K(r,c));
    }
    g.blocked.forEach(([r,c]) => occ.set(K(r,c), -1));   // x 禁行格
    const V = new Set(g.W.V.map(([r,c]) => K(r,c)));
    const H = new Set(g.W.H.map(([r,c]) => K(r,c)));
    G[key] = {key, maxr:g.maxr, maxc:g.maxc, blocks:g.blocks, occ, occAll, V, H, walk};
  }

  const pass = (g, r, c, dr, dc) =>            // 兩格之間有沒有牆
      dc ===  1 ? !g.V.has(K(r, c+1))
    : dc === -1 ? !g.V.has(K(r, c))
    : dr ===  1 ? !g.H.has(K(r+1, c))
    :             !g.H.has(K(r, c));

  /* 每格離最近障礙多遠，用來把路線推向走道中線 */
  function clearance(g){
    if(g.clr) return g.clr;
    const clr = new Map(), q = [];
    for(let r = 1; r <= g.maxr; r++) for(let c = 1; c <= g.maxc; c++){
      const k = K(r,c);
      if(g.occ.has(k)) continue;
      let near = false;
      for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nr = r+dr, nc = c+dc;
        if(nr < 1 || nr > g.maxr || nc < 1 || nc > g.maxc
           || g.occ.has(K(nr,nc)) || !pass(g,r,c,dr,dc)){ near = true; break; }
      }
      if(near){ clr.set(k,1); q.push(k); }
    }
    for(let i = 0; i < q.length; i++){
      const k = q[i], r = KR(k), c = KC(k), d = clr.get(k);
      for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nr = r+dr, nc = c+dc;
        if(nr < 1 || nr > g.maxr || nc < 1 || nc > g.maxc) continue;
        const nk = K(nr,nc);
        if(g.occ.has(nk) || clr.has(nk) || !pass(g,r,c,dr,dc)) continue;
        clr.set(nk, d+1); q.push(nk);
      }
    }
    g.clr = clr; return clr;
  }

  const cmpKey = (a, b)=>{ for(let i = 0; i < a.length; i++) if(a[i] !== b[i]) return a[i] - b[i]; return 0; };
  const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
  const dirIdx = (dr,dc) => dr === 1 ? 0 : dr === -1 ? 1 : dc === 1 ? 2 : 3;

  function dijkstra(gk, startKs, goalKs, limit, avoidOutdoor){
    const g = G[gk], clr = clearance(g);
    const starts = [...startKs].filter(k => !g.occ.has(k) && (!limit || limit.has(k)));
    const goals  = new Set([...goalKs].filter(k => !g.occ.has(k) && (!limit || limit.has(k))));
    if(!starts.length || !goals.size) return null;

    let gr = 0, gc = 0;
    goals.forEach(k=>{ gr += KR(k); gc += KC(k); });
    gr /= goals.size; gc /= goals.size;

    const best = new Map(), prev = new Map();
    const heap = [];                                   // [cost, state]
    const push = (cost, st)=>{
      heap.push([cost, st]); let i = heap.length - 1;
      while(i > 0){ const p = (i-1) >> 1;
        if(heap[p][0] <= heap[i][0]) break;
        [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; }
    };
    const pop = ()=>{
      const top = heap[0], last = heap.pop();
      if(heap.length){ heap[0] = last; let i = 0;
        for(;;){ const l = 2*i+1, r = l+1; let m = i;
          if(l < heap.length && heap[l][0] < heap[m][0]) m = l;
          if(r < heap.length && heap[r][0] < heap[m][0]) m = r;
          if(m === i) break;
          [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } }
      return top;
    };
    for(const s of starts){
      const dr = gr - KR(s), dc = gc - KC(s);
      const lead = Math.abs(dc) >= Math.abs(dr) ? (dc > 0 ? [0,1] : [0,-1])
                                                : (dr > 0 ? [1,0] : [-1,0]);
      const st = s * 4 + dirIdx(lead[0], lead[1]);
      best.set(st, 0); push(0, st);
    }
    while(heap.length){
      const [dd, st] = pop();
      if(dd > (best.get(st) ?? Infinity) + 1e-9) continue;
      const k = st >> 2, pd = st & 3;
      if(goals.has(k)){
        const out = [k]; let cur = st;
        while(prev.has(cur)){ cur = prev.get(cur); out.push(cur >> 2); }
        return out.reverse().map(x => [KR(x), KC(x)]);
      }
      const r = KR(k), c = KC(k);
      for(let di = 0; di < 4; di++){
        const [dr,dc] = DIRS[di];
        const nr = r+dr, nc = c+dc;
        if(nr < 1 || nr > g.maxr || nc < 1 || nc > g.maxc) continue;
        const nk = K(nr,nc);
        if(g.occ.has(nk) || !pass(g,r,c,dr,dc)) continue;
        if(limit && !limit.has(nk)) continue;
        let nd = dd + 1 + Math.max(0, 3 - (clr.get(nk) ?? 1)) * 0.35;
        if(di !== pd) nd += TURN_COST;
        if(avoidOutdoor && !INDOOR.has(nk)) nd += OUTDOOR_COST;
        const ns = nk * 4 + di;
        if(nd < (best.get(ns) ?? Infinity) - 1e-9){
          best.set(ns, nd); prev.set(ns, st); push(nd, ns);
        }
      }
    }
    return null;
  }

  /* 區塊四周可以站的格子 */
  function ring(gk, rect, limit){
    const g = G[gk], out = new Set();
    const [r1,c1,r2,c2] = rect;
    for(let r = r1-1; r <= r2+1; r++) for(let c = c1-1; c <= c2+1; c++){
      if(r < 1 || r > g.maxr || c < 1 || c > g.maxc) continue;
      const k = K(r,c);
      if(g.occ.has(k)) continue;
      if(limit && !limit.has(k)) continue;
      out.add(k);
    }
    return out;
  }
  /* 區塊的「入口」格子：緊貼區塊某一邊、而且那一邊沒有牆（粗黑線），不含斜角 */
  function doorRing(gk, rect, limit){
    const g = G[gk], out = new Set();
    const [r1,c1,r2,c2] = rect;
    const add = (r, c, dr, dc)=>{          // (r,c) 是區塊外那格，往 (dr,dc) 走一步會進到區塊
      if(r < 1 || r > g.maxr || c < 1 || c > g.maxc) return;
      const k = K(r,c);
      if(g.occ.has(k) || (limit && !limit.has(k))) return;
      if(!pass(g, r, c, dr, dc)) return;
      out.add(k);
    };
    for(let c = c1; c <= c2; c++){ add(r1-1, c, 1, 0); add(r2+1, c, -1, 0); }
    for(let r = r1; r <= r2; r++){ add(r, c1-1, 0, 1); add(r, c2+1, 0, -1); }
    return out;
  }
  const ringAll = (gk, rects, limit)=>{
    const s = new Set();
    rects.forEach(rc => ring(gk, rc, limit).forEach(k => s.add(k)));
    return s;
  };
  function ownCells(rects){
    const s = new Set();
    for(const [name, cells] of Object.entries(BUILD)){
      let hit = false;
      for(const [r1,c1,r2,c2] of rects){
        for(let r = r1; r <= r2 && !hit; r++) for(let c = c1; c <= c2; c++)
          if(cells.has(K(r,c))){ hit = true; break; }
        if(hit) break;
      }
      if(hit) cells.forEach(k => s.add(k));
    }
    return s;
  }
  const vertsOf = gk => G[gk].blocks.filter(b =>
      b.label && (b.label.indexOf('樓梯') >= 0 || b.label.indexOf('電梯') >= 0));
  const kindOfVert = b => b.label.indexOf('電梯') >= 0 ? '電梯' : '樓梯';
  const floorOfGrid = gk => D.gridFloor[gk] || 1;

  /* 出發點可以站的格子：校門口用正中央那一格，其餘用區塊外圍 */
  function startCells(from){
    const g = G[from.grid];
    if(from.gate){
      const [r1,c1,r2,c2] = from.rects[0];
      const mr = (r1+r2)/2, mc = (c1+c2)/2, clr = clearance(g);
      let bk = null, bd = Infinity;
      for(let r = r1; r <= r2; r++) for(let c = c1; c <= c2; c++){
        const k = K(r,c);
        if(g.occ.has(k) || (clr.get(k) ?? 0) < 2) continue;
        const d = (r-mr)**2 + (c-mc)**2;
        if(d < bd){ bd = d; bk = k; }
      }
      if(bk !== null) return new Set([bk]);
    }
    const own = from.grid === D.baseGrid ? null : ownCells(from.rects);
    const s = ringAll(from.grid, from.rects, own);
    return s.size ? s : ringAll(from.grid, from.rects, null);
  }

  /* 主函數：from 與 to 都是 {grid, rects}，to 另外帶 place 資訊 */
  function route(from, to, mode){
    const avoid = mode === 'indoor';
    const cells = ownCells(to.rects);
    const cellSet = cells.size ? cells : null;

    if(from.grid === to.grid){
      const sameBlock = from.rects.some(a => to.rects.some(b =>
        a[0]===b[0] && a[1]===b[1] && a[2]===b[2] && a[3]===b[3]));
      if(sameBlock){
        const r = [...ring(from.grid, from.rects[0])];
        const here = r.length ? [KR(r[(r.length/2)|0]), KC(r[(r.length/2)|0])]
                              : [from.rects[0][0], from.rects[0][1]];
        return {legs:[{grid:from.grid, path:[here]}], via:null, same:true};
      }
      const lim = from.grid === D.baseGrid ? null : INDOOR;
      let goals = ringAll(to.grid, to.rects, cellSet);
      if(!goals.size) goals = ringAll(to.grid, to.rects, null);
      const path = dijkstra(from.grid, startCells(from), goals, lim, avoid);
      if(!path) return null;
      return {legs:[{grid:from.grid, path}], via:null};
    }

    /* 跨樓層：起點層走到垂直動線，再在目標層走到目的地 */
    const haveAtStart = new Set(vertsOf(from.grid).map(b => b.r1 + ',' + b.c1));
    let verts = vertsOf(to.grid).filter(b => haveAtStart.has(b.r1 + ',' + b.c1));
    let limit2;
    if(mode === 'lift'){
      verts = verts.filter(b => kindOfVert(b) === '電梯');
      limit2 = INDOOR;
    } else if(mode === 'indoor' || from.grid !== D.baseGrid){
      limit2 = INDOOR;
    } else {
      verts = verts.filter(b => {
        for(let r = b.r1; r <= b.r2; r++) for(let c = b.c1; c <= b.c2; c++)
          if(cells.has(K(r,c))) return true;
        return false;
      });
      limit2 = cellSet;
    }
    if(!verts.length) return null;

    let best = null;
    for(const v of verts){
      const vr = [v.r1, v.c1, v.r2, v.c2];
      let vcells = cells;
      if(mode === 'lift' || mode === 'indoor' || from.grid !== D.baseGrid){
        vcells = ownCells([vr]);
        if(!vcells.size) continue;
      }
      const lim1 = from.grid === D.baseGrid ? null : INDOOR;
      let door1 = doorRing(from.grid, vr, vcells);
      if(!door1.size) door1 = ring(from.grid, vr, vcells);
      const p1 = dijkstra(from.grid, startCells(from), door1, lim1, avoid);
      if(!p1) continue;
      const entry = K(p1[p1.length-1][0], p1[p1.length-1][1]);
      let r2ing = doorRing(to.grid, vr, vcells);
      if(!r2ing.size) r2ing = ring(to.grid, vr, vcells);
      if(!r2ing.size) continue;
      const exact = r2ing.has(entry);
      let s2;
      if(exact) s2 = new Set([entry]);
      else {
        let bk = null, bd = Infinity;
        r2ing.forEach(k=>{
          const d = (KR(k)-KR(entry))**2 + (KC(k)-KC(entry))**2;
          if(d < bd){ bd = d; bk = k; }
        });
        s2 = new Set([bk]);
      }
      let goals2 = ringAll(to.grid, to.rects, cellSet);
      if(!goals2.size) goals2 = ringAll(to.grid, to.rects, null);
      // 目的地若在戶外（活動中心、圖書館、校門口），第二段就不能限制在室內
      let lim2 = limit2;
      if(lim2){ let ok = false; goals2.forEach(k=>{ if(lim2.has(k)) ok = true; }); if(!ok) lim2 = null; }
      const p2 = dijkstra(to.grid, s2, goals2, lim2, avoid);
      if(!p2) continue;
      const out1 = mode === 'indoor'
        ? p1.reduce((n,[r,c]) => n + (INDOOR.has(K(r,c)) ? 0 : 1), 0) : 0;
      const key = [exact ? 0 : 1, mode === 'indoor' ? out1 : 0, p1.length + p2.length];
      // 注意：JS 的陣列 < 會轉成字串比較（"0,0,88" > "0,0,171"），必須逐項比數值
      if(!best || cmpKey(key, best.key) < 0) best = {key, p1, p2, kind: kindOfVert(v)};
    }
    if(!best) return null;
    return {legs:[{grid:from.grid, path:best.p1}, {grid:to.grid, path:best.p2}],
            via:best.kind};
  }

  return {route, G, BUILD, INDOOR, floorOfGrid};
}




/* 男女廁、無障礙、電梯、樓梯用圖示，不用文字 */
const ICONS = {
  stair: '<path d="M2.5 21h4.6v-4.4h4.6v-4.4h4.6V7.8h4.8" fill="none" stroke="CUR" ' +
         'stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>',
  lift:  '<rect x="4.5" y="2.8" width="15" height="18.4" rx="1.8" fill="none" stroke="CUR" stroke-width="2"/>' +
         '<path d="M12 6.4l-2.9 4h5.8z" fill="CUR"/><path d="M12 17.6l-2.9-4h5.8z" fill="CUR"/>',
  male:  '<circle cx="12" cy="4.4" r="2.6" fill="CUR"/>' +
         '<path d="M8.6 8.4h6.8l1.5 7.2h-2.4l-.5 6.2h-3.5l-.5-6.2H7.1z" fill="CUR"/>',
  female:'<circle cx="12" cy="4.4" r="2.6" fill="CUR"/>' +
         '<path d="M12 8.1l4.6 9.1h-2.7l.6 4.6h-5l.6-4.6H7.4z" fill="CUR"/>',
  water: '<path d="M5.5 7.5h10.5v6.6a5.2 5.2 0 0 1-5.2 5.2h-.1a5.2 5.2 0 0 1-5.2-5.2z" ' +
         'fill="none" stroke="CUR" stroke-width="2"/>' +
         '<path d="M16 9.6h2.2a2.4 2.4 0 0 1 0 4.8H16" fill="none" stroke="CUR" stroke-width="2"/>' +
         '<path d="M8.4 2.2v2.6M12 2.2v2.6" stroke="CUR" stroke-width="2" stroke-linecap="round"/>',
  wc:    '<circle cx="9.6" cy="4.2" r="2.3" fill="CUR"/>' +
         '<path d="M7.6 7.6v6.2h5.6l3 6.4" fill="none" stroke="CUR" stroke-width="2.2" ' +
         'stroke-linecap="round" stroke-linejoin="round"/>' +
         '<circle cx="11.4" cy="16.4" r="5.2" fill="none" stroke="CUR" stroke-width="2"/>'
};
function iconKey(label){
  const t = (label || '').replace(/\n/g, '');
  if(/無障礙/.test(t)) return 'wc';
  if(/男廁/.test(t))   return 'male';
  if(/女廁/.test(t))   return 'female';
  if(/電梯/.test(t))   return 'lift';
  if(/樓梯/.test(t))   return 'stair';
  if(/茶水/.test(t))   return 'water';
  return null;
}


/* 分類顏色 */
function kindOf(label){
  if(!label) return 'blank';
  const t = label.replace(/\n/g,'');
  if(t === '連城路') return 'outer';
  if(/門口|校門/.test(t)) return 'gate';
  if(/樓梯|電梯/.test(t)) return 'vert';
  if(/廁|無障礙|茶水/.test(t)) return 'wc';
  if(/(樓|館|中心)$/.test(t) && t.length <= 5 && !/教室|資源中心/.test(t)) return 'bldg';
  return 'room';
}
const FILL = {bldg:'var(--bldg)', room:'var(--room)', wc:'var(--wc)', vert:'var(--vert)',
              gate:'var(--gate)', outer:'var(--field)', blank:'var(--field)'};


/* 依路線裁切出 viewBox，並畫圖；縱長的樓層圖自動轉 90 度 */
function drawMap(gridKey, path, target){
  const d = MAPS[gridKey];
  let r1 = Infinity, c1 = Infinity, r2 = -1, c2 = -1;
  const touch = ([r,c]) => { r1=Math.min(r1,r); c1=Math.min(c1,c); r2=Math.max(r2,r); c2=Math.max(c2,c); };
  /* 兩種圖都看整張：1F＋戶外 一張、室內樓層 一張。
     裁切會讓每張圖忽大忽小、方向也不一致，家長反而看不懂 */
  r1 = 1; c1 = 1; r2 = d.maxr; c2 = d.maxc;

  const cols = c2-c1+1, rows = r2-r1+1;
  /* rot 0/90/180/270：把圖整個轉向，文字仍保持水平 */
  const rot = 0;               // 一律用原圖方向，每張圖的方位才一致
  const flip = false;
  const longSide = flip ? rows : cols;
  const CELL = Math.max(7, Math.min(30, 760/longSide));
  const W = (flip ? rows : cols) * CELL;
  const H = (flip ? cols : rows) * CELL;

  const gx = (r, c) => rot === 0   ? [c-c1, r-r1]
                     : rot === 90  ? [r2-r, c-c1]
                     : rot === 180 ? [c2-c, r2-r]
                     :               [r-r1, c2-c];
  const mid = (r, c) => { const [a,b] = gx(r,c); return [(a+.5)*CELL, (b+.5)*CELL]; };
  const box = (br1, bc1, br2, bc2) => {
    const hh = br2-br1+1, ww = bc2-bc1+1;
    if(rot === 0)   return [(bc1-c1)*CELL, (br1-r1)*CELL, ww*CELL, hh*CELL];
    if(rot === 90)  return [(r2-br2)*CELL, (bc1-c1)*CELL, hh*CELL, ww*CELL];
    if(rot === 180) return [(c2-bc2)*CELL, (r2-br2)*CELL, ww*CELL, hh*CELL];
    return [(br1-r1)*CELL, (c2-bc2)*CELL, hh*CELL, ww*CELL];
  };
  const S = v => (v*CELL).toFixed(1);
  const vline = (r, c) =>                      // 格子 (r,c) 的左邊界
      rot === 0   ? `M${S(c-c1)} ${S(r-r1)}v${CELL.toFixed(1)}`
    : rot === 90  ? `M${S(r2-r)} ${S(c-c1)}h${CELL.toFixed(1)}`
    : rot === 180 ? `M${S(c2-c+1)} ${S(r2-r)}v${CELL.toFixed(1)}`
    :               `M${S(r-r1)} ${S(c2-c+1)}h${CELL.toFixed(1)}`;
  const hline = (r, c) =>                      // 格子 (r,c) 的上邊界
      rot === 0   ? `M${S(c-c1)} ${S(r-r1)}h${CELL.toFixed(1)}`
    : rot === 90  ? `M${S(r2-r+1)} ${S(c-c1)}v${CELL.toFixed(1)}`
    : rot === 180 ? `M${S(c2-c)} ${S(r2-r+1)}h${CELL.toFixed(1)}`
    :               `M${S(r-r1)} ${S(c2-c)}v${CELL.toFixed(1)}`;

  const FS = CELL * 1.5;          // 全圖統一的文字大小
  const parts = [];
  d.blocks.forEach(b=>{
    if(b.r2 < r1 || b.r1 > r2 || b.c2 < c1 || b.c1 > c2) return;
    const k = kindOf(b.label);
    const hit = target && (target.refs || [target.ref]).indexOf(b.ref) >= 0;
    const [x,y,w,h] = box(b.r1, b.c1, b.r2, b.c2);
    parts.push(`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}"
      height="${h.toFixed(1)}" rx="2" fill="${FILL[k]}"></rect>`);
    if(hit){
      parts.push(`<rect class="desthi" x="${x.toFixed(1)}" y="${y.toFixed(1)}"
        width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--mark)"></rect>
        <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}"
        height="${h.toFixed(1)}" rx="2" fill="none" stroke="var(--mark)"
        stroke-width="${Math.max(2, CELL*0.28).toFixed(1)}"></rect>`);
    }
    if(!b.label) return;

    const ik = iconKey(b.label);
    if(ik){
      const size = Math.min(w, h) * 0.66;
      const sc = size / 24;
      parts.push(`<g transform="translate(${(x+w/2-size/2).toFixed(1)},${(y+h/2-size/2).toFixed(1)}) scale(${sc.toFixed(3)})"
        opacity=".8">${ICONS[ik].replace(/CUR/g, 'var(--ink-soft)')}</g>`);
      return;
    }

    /* 所有場域同一個字級，放不下就自動換行 */
    const perLine = Math.max(1, Math.floor(w * 0.9 / FS));
    const maxLines = Math.max(1, Math.floor(h * 0.9 / (FS * 1.16)));
    const rows = [];
    b.label.split('\n').forEach(seg=>{
      for(let i = 0; i < seg.length; i += perLine) rows.push(seg.slice(i, i + perLine));
    });
    if(FS > w * 0.9) return;                    // 一個字都放不下就別畫
    const shown = rows.length > maxLines
      ? rows.slice(0, maxLines - 1).concat(
          rows[maxLines-1].slice(0, Math.max(1, perLine - 1)) + '\u2026')
      : rows;
    shown.forEach((ln, i)=>{
      parts.push(`<text x="${(x+w/2).toFixed(1)}"
        y="${(y + h/2 + (i - (shown.length-1)/2) * FS * 1.16 + FS*0.35).toFixed(1)}"
        text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="${FS.toFixed(1)}"
        font-weight="${hit ? 800 : 500}"
        fill="${hit ? 'var(--mark)' : 'var(--ink-soft)'}"
        ${hit ? 'stroke="var(--panel)" stroke-width="'+(FS*0.16).toFixed(1)+'" paint-order="stroke"' : ''}
        >${ln}</text>`);
    });
  });

  const seg = (set, dashed, mul, col) => {
    const p = [];
    (set.V || []).forEach(([r,c])=>{
      if(r < r1 || r > r2 || c < c1 || c > c2+1) return; p.push(vline(r,c));
    });
    (set.H || []).forEach(([r,c])=>{
      if(r < r1 || r > r2+1 || c < c1 || c > c2) return; p.push(hline(r,c));
    });
    if(!p.length) return '';
    const lw = Math.max(1.2, CELL*0.2);
    return `<path d="${p.join('')}" stroke="${col}" stroke-width="${(lw*mul).toFixed(1)}"
      fill="none" ${dashed ? `stroke-dasharray="${(lw*2).toFixed(1)} ${(lw*1.8).toFixed(1)}"` : ''}
      stroke-linecap="butt"></path>`;
  };
  parts.push(seg(d.W, false, 1.0, 'var(--ink)'));   // 只畫牆

  // 破折虛線（可通過的區隔）和點虛線（入口）只給程式判斷，畫出來反而像牆

  if(path.length > 1){
    const pts = path.map(([r,c])=>mid(r,c).map(v=>v.toFixed(1)).join(',')).join(' ');
    parts.push(`<polyline points="${pts}" fill="none" stroke="var(--route)"
      stroke-width="${Math.max(3, CELL*0.42).toFixed(1)}"
      stroke-linecap="round" stroke-linejoin="round" class="rline"></polyline>`);
  }
  const rad = Math.max(4, CELL*0.42);
  const dot = ([r,c], fill, ring) => {
    const [x,y] = mid(r,c);
    return (ring ? `<circle class="pulse" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}"
              r="${(rad*1.7).toFixed(1)}" fill="${fill}"></circle>` : '')
      + `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(1)}" fill="${fill}"
          stroke="var(--panel)" stroke-width="${(rad*0.4).toFixed(1)}"></circle>`;
  };
  if(path.length > 1){
    const [x0,y0] = mid(path[0][0], path[0][1]);
    const [x1,y1] = mid(path[1][0], path[1][1]);
    const ang = Math.atan2(y1-y0, x1-x0) * 180 / Math.PI + 90;
    const a = rad * 1.15;
    parts.push(`<g transform="translate(${x0.toFixed(1)},${y0.toFixed(1)}) rotate(${ang.toFixed(0)})">
      <path d="M0,${(-a*1.5).toFixed(1)} L${a.toFixed(1)},${(a*.9).toFixed(1)}
        L0,${(a*.45).toFixed(1)} L${(-a).toFixed(1)},${(a*.9).toFixed(1)} Z"
        fill="var(--ink)" stroke="var(--panel)" stroke-width="${(rad*.34).toFixed(1)}"
        stroke-linejoin="round"></path></g>`);
  } else {
    parts.push(dot(path[0], 'var(--ink)', false));
  }
  parts.push(dot(path[path.length-1], 'var(--mark)', true));


  const note = '';
  return `<div class="mapbox"><svg viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}"
    width="${W.toFixed(0)}" height="${H.toFixed(0)}" role="img" aria-label="路線圖">
    <rect x="0" y="0" width="${W.toFixed(0)}" height="${H.toFixed(0)}" fill="var(--field)"></rect>
    ${parts.join('')}
  </svg></div>${note}`;
}


/* 2.5D 等角視角：把每個樓層的平面斜放，依樓層高低堆疊，一張圖看完整條路線 */
const ISO_COS = Math.cos(Math.PI/6), ISO_SIN = 0.5;

function drawIso(legs, target, opts){
  const o = Object.assign({pad:3, gapRatio:0.62, width:880}, opts || {});

  /* 每一段各自裁切到用得到的範圍 */
  const segs = legs.map(leg=>{
    const d = MAPS[leg.grid];
    let r1=Infinity, c1=Infinity, r2=-1, c2=-1;
    const touch = (r,c)=>{ r1=Math.min(r1,r); c1=Math.min(c1,c); r2=Math.max(r2,r); c2=Math.max(c2,c); };
    leg.path.forEach(([r,c]) => touch(r,c));
    if(target && leg === legs[legs.length-1])
      (target.rects || []).forEach(([a,b,cc,dd])=>{ touch(a,b); touch(cc,dd); });
    r1=Math.max(1,r1-o.pad); c1=Math.max(1,c1-o.pad);
    r2=Math.min(d.maxr,r2+o.pad); c2=Math.min(d.maxc,c2+o.pad);
    return {leg, d, r1, c1, r2, c2, floor: D.gridFloor[leg.grid] || 1};
  });

  /* 格子大小依裁切範圍自適應，讓整張圖落在預期寬度 */
  const wideCells = Math.max(...segs.map(s => (s.c2-s.c1+1) + (s.r2-s.r1+1)));
  const CELL = Math.max(5, Math.min(13, o.width / (wideCells * ISO_COS)));

  /* 每層的垂直位移：由下往上疊，最低的樓層放最下面 */
  const minF = Math.min(...segs.map(s => s.floor));
  const spanOf = s => ((s.r2-s.r1+1) + (s.c2-s.c1+1)) * ISO_SIN;   // 該層菱形的高（格）
  const maxSpan = Math.max(...segs.map(spanOf));
  const GAP = maxSpan * o.gapRatio;
  /* 樓層差用非線性壓縮：跨 6 層不必畫成跨 1 層的 6 倍高，
     高低看得出來就夠，實際樓層由圖上的 1F／7F 標籤說明 */
  segs.forEach(s=>{
    const df = s.floor - minF;
    s.dz = df === 0 ? 0 : GAP * (1 + (df - 1) * 0.28);
  });

  const P = (s, r, c) => [ (c - s.c1 - (r - s.r1)) * ISO_COS * CELL,
                           ((c - s.c1) + (r - s.r1)) * ISO_SIN * CELL - s.dz * CELL ];

  /* 畫布範圍 */
  let X0=Infinity, Y0=Infinity, X1=-Infinity, Y1=-Infinity;
  segs.forEach(s=>{
    [[s.r1,s.c1],[s.r1,s.c2+1],[s.r2+1,s.c1],[s.r2+1,s.c2+1]].forEach(([r,c])=>{
      const [x,y] = P(s,r,c);
      X0=Math.min(X0,x); Y0=Math.min(Y0,y); X1=Math.max(X1,x); Y1=Math.max(Y1,y);
    });
  });
  const M = 34;
  const W = (X1-X0) + M*2, H = (Y1-Y0) + M*2 + 10;
  const T = (s,r,c)=>{ const [x,y]=P(s,r,c); return [(x-X0+M).toFixed(1), (y-Y0+M).toFixed(1)]; };

  const parts = [];
  /* 由低樓層往高樓層畫，上層自然疊在前面 */
  segs.slice().sort((a,b)=>a.dz-b.dz).forEach((s, si)=>{
    const d = s.d;
    const poly = (r1,c1,r2,c2)=>[[r1,c1],[r1,c2+1],[r2+1,c2+1],[r2+1,c1]]
      .map(([r,c])=>T(s,r,c).join(',')).join(' ');

    /* 樓層底板 */
    parts.push(`<polygon points="${poly(s.r1,s.c1,s.r2,s.c2)}"
      fill="var(--field)" stroke="var(--line)" stroke-width="1.2"></polygon>`);

    /* 房間 */
    d.blocks.forEach(b=>{
      if(b.r2 < s.r1 || b.r1 > s.r2 || b.c2 < s.c1 || b.c1 > s.c2) return;
      const k = kindOf(b.label);
      const hit = target && (target.refs || []).indexOf(b.ref) >= 0 && s === segs[segs.length-1];
      const br1=Math.max(b.r1,s.r1), bc1=Math.max(b.c1,s.c1),
            br2=Math.min(b.r2,s.r2), bc2=Math.min(b.c2,s.c2);
      parts.push(`<polygon points="${poly(br1,bc1,br2,bc2)}" fill="${FILL[k]}"
        stroke="var(--line)" stroke-width=".5"></polygon>`);
      if(hit){
        parts.push(`<polygon class="desthi" points="${poly(br1,bc1,br2,bc2)}"
          fill="var(--mark)"></polygon>
          <polygon points="${poly(br1,bc1,br2,bc2)}" fill="none"
          stroke="var(--mark)" stroke-width="2.4"></polygon>`);
      }
      /* 名稱：畫在區塊中心，保持水平才讀得到 */
      const label = (b.label || '').replace(/\n/g,' ');
      if(!label) return;
      const ik = iconKey(b.label);
      const [mx,my] = T(s, (br1+br2+1)/2, (bc1+bc2+1)/2);
      if(ik){
        const size = CELL * 1.5, sc = size/24;
        parts.push(`<g transform="translate(${(+mx-size/2).toFixed(1)},${(+my-size/2).toFixed(1)}) scale(${sc.toFixed(3)})"
          opacity=".8">${ICONS[ik].replace(/CUR/g,'var(--ink-soft)')}</g>`);
        return;
      }
      const wCells = (bc2-bc1+1), hCells = (br2-br1+1);
      const fs = Math.min(CELL * 1.15, (Math.min(wCells,hCells) * CELL * ISO_COS) / Math.max(2, label.length) * 2.1);
      if(fs < 6) return;
      parts.push(`<text x="${mx}" y="${(+my + fs*0.34).toFixed(1)}" text-anchor="middle"
        font-family="'Noto Sans TC',sans-serif" font-size="${fs.toFixed(1)}"
        font-weight="${hit?800:500}" fill="${hit?'var(--mark)':'var(--ink-soft)'}"
        ${hit?'stroke="var(--panel)" stroke-width="'+(fs*.16).toFixed(1)+'" paint-order="stroke"':''}
        >${label}</text>`);
    });

    /* 牆 */
    const wp = [];
    d.W.V.forEach(([r,c])=>{
      if(r < s.r1 || r > s.r2 || c < s.c1 || c > s.c2+1) return;
      wp.push('M' + T(s,r,c).join(' ') + 'L' + T(s,r+1,c).join(' '));
    });
    d.W.H.forEach(([r,c])=>{
      if(r < s.r1 || r > s.r2+1 || c < s.c1 || c > s.c2) return;
      wp.push('M' + T(s,r,c).join(' ') + 'L' + T(s,r,c+1).join(' '));
    });
    if(wp.length) parts.push(`<path d="${wp.join('')}" stroke="var(--ink)"
      stroke-width="1.9" fill="none" stroke-linecap="round"></path>`);

    /* 樓層標籤 */
    const [lx,ly] = T(s, s.r1, s.c1);
    parts.push(`<text x="${(+lx - 6).toFixed(1)}" y="${(+ly - 8).toFixed(1)}" text-anchor="end"
      font-family="'Barlow Condensed',sans-serif" font-size="17" font-weight="700"
      fill="var(--ink-soft)">${s.floor}F</text>`);

    /* 路線 */
    const pts = s.leg.path.map(([r,c]) => T(s, r+0.5, c+0.5).join(',')).join(' ');
    parts.push(`<polyline points="${pts}" fill="none" stroke="var(--route)"
      stroke-width="${Math.max(3, CELL*0.36).toFixed(1)}" stroke-linecap="round"
      stroke-linejoin="round" class="rline"></polyline>`);
  });

  /* 樓層之間的連接：從下層的終點拉一條柱子到上層的起點 */
  for(let i = 1; i < segs.length; i++){
    const a = segs[i-1], b = segs[i];
    const ap = a.leg.path[a.leg.path.length-1], bp = b.leg.path[0];
    const [ax,ay] = T(a, ap[0]+0.5, ap[1]+0.5);
    const [bx,by] = T(b, bp[0]+0.5, bp[1]+0.5);
    parts.push(`<path d="M${ax} ${ay}L${bx} ${by}" stroke="var(--route)"
      stroke-width="${Math.max(2.5, CELL*0.3).toFixed(1)}" stroke-dasharray="5 4"
      opacity=".85" stroke-linecap="round"></path>`);
    const mx = (+ax + +bx)/2, my = (+ay + +by)/2;
    parts.push(`<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="12"
      fill="var(--route)" opacity=".95"></circle>
      <text x="${mx.toFixed(1)}" y="${(my+4.5).toFixed(1)}" text-anchor="middle"
      font-family="'Noto Sans TC',sans-serif" font-size="12" font-weight="800"
      fill="var(--on-route)">${b.floor > a.floor ? '↑' : '↓'}</text>`);
  }

  /* 起點箭頭與終點 */
  const first = segs[0], last = segs[segs.length-1];
  const fp = first.leg.path[0];
  const [fx,fy] = T(first, fp[0]+0.5, fp[1]+0.5);
  parts.push(`<circle cx="${fx}" cy="${fy}" r="${(CELL*0.42).toFixed(1)}"
    fill="var(--ink)" stroke="var(--panel)" stroke-width="2.2"></circle>`);
  const lp = last.leg.path[last.leg.path.length-1];
  const [tx,ty] = T(last, lp[0]+0.5, lp[1]+0.5);
  parts.push(`<circle class="pulse" cx="${tx}" cy="${ty}" r="11" fill="var(--mark)"></circle>
    <circle cx="${tx}" cy="${ty}" r="${(CELL*0.42).toFixed(1)}" fill="var(--mark)"
    stroke="var(--panel)" stroke-width="2.2"></circle>`);

  return `<div class="mapbox"><svg viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}"
    width="${W.toFixed(0)}" height="${H.toFixed(0)}" role="img" aria-label="立體路線圖">
    ${parts.join('')}
  </svg></div>`;
}

/* 建築量體：從平面圖把每棟樓擠出成立方體，一張圖看整個校園與路線 */
const MS_COS = Math.cos(Math.PI/6), MS_SIN = 0.5;

/* 只有一層可去、但實際很高的建築：立體圖照實際高度畫，不畫樓層線 */
const BUILD_HEIGHT = {'活動中心': 4, '圖書館': 5};
function buildTopFloor(){
  if(buildTopFloor.cache) return buildTopFloor.cache;
  const t = {};
  PLACES.forEach(p => { t[p.bldg] = Math.max(t[p.bldg] || 1, p.floor || 1); });
  Object.entries(BUILD_HEIGHT).forEach(([b, h]) => { t[b] = Math.max(t[b] || 1, h); });
  return (buildTopFloor.cache = t);
}

/* 目的地高亮範圍：房間往外穿過走道，直到碰到外牆（走道寬度 4 格以內才延伸），
   這樣立體圖的外牆上也看得出是哪一層 */
function destRects(target){
  if(!target || !target.rects) return [];
  destRects.cache = destRects.cache || {};
  if(destRects.cache[target.key]) return destRects.cache[target.key];
  const runs = D.build[target.bldg], g = MAPS[target.grid];
  if(!runs || !g) return (destRects.cache[target.key] = target.rects);
  const inB = new Set();
  runs.forEach(([r,a,b]) => { for(let c=a;c<=b;c++) inB.add(r*256+c); });
  const room = new Set();
  g.blocks.forEach(bl => {
    if(D.build[bl.label]) return;
    for(let r=bl.r1;r<=bl.r2;r++) for(let c=bl.c1;c<=bl.c2;c++) room.add(r*256+c);
  });
  const corr = (r,c) => inB.has(r*256+c) && !room.has(r*256+c);
  const out = (r,c) => !inB.has(r*256+c);
  const MAXW = 4;
  const res = target.rects.map(([r1,c1,r2,c2]) => {
    const row = (r, f) => { for(let c=c1;c<=c2;c++) if(!f(r,c)) return false; return true; };
    const col = (c, f) => { for(let r=r1;r<=r2;r++) if(!f(r,c)) return false; return true; };
    const reach = (lineOK, start, step) => {
      let k = 0;
      while(k < MAXW && lineOK(start + step*k, corr)) k++;
      return (k > 0 && lineOK(start + step*k, out)) ? k : 0;
    };
    const s = reach((r,f)=>row(r,f), r2+1,  1);
    const n = reach((r,f)=>row(r,f), r1-1, -1);
    const e = reach((c,f)=>col(c,f), c2+1,  1);
    const w = reach((c,f)=>col(c,f), c1-1, -1);
    const list = [[r1,c1,r2,c2]];
    if(s) list.push([r2+1, c1, r2+s, c2]);
    if(n) list.push([r1-n, c1, r1-1, c2]);
    if(e) list.push([r1, c2+1, r2, c2+e]);
    if(w) list.push([r1, c1-w, r2, c1-1]);
    /* 轉角也都是走道就合成一個大方塊，否則分開畫 */
    const R1 = r1-n, R2 = r2+s, C1 = c1-w, C2 = c2+e;
    let whole = true;
    for(let r=R1;r<=R2 && whole;r++) for(let c=C1;c<=C2;c++){
      const inside = r>=r1 && r<=r2 && c>=c1 && c<=c2;
      if(!inside && !corr(r,c)){ whole = false; break; }
    }
    return whole ? [[R1,C1,R2,C2]] : list;
  }).flat();
  return (destRects.cache[target.key] = res);
}

/* 立體圖的樓梯間／電梯井：只畫這次會經過的那幾層 */
function drawVertical(v, P, ZS){
  const {r1, c1, r2, c2} = v.b;
  const f = pts => pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
  /* 一個方塊（實數座標）：頂面、南面、東面 */
  const box = (ra, rb, ca, cb, za, zb, cls) =>
    `<polygon points="${f([[ra,ca,zb],[ra,cb,zb],[rb,cb,zb],[rb,ca,zb]].map(q=>P(...q)))}" class="${cls} v-top"></polygon>` +
    `<polygon points="${f([[rb,ca,za],[rb,cb,za],[rb,cb,zb],[rb,ca,zb]].map(q=>P(...q)))}" class="${cls} v-south"></polygon>` +
    `<polygon points="${f([[ra,cb,za],[rb,cb,za],[rb,cb,zb],[ra,cb,zb]].map(q=>P(...q)))}" class="${cls} v-east"></polygon>`;
  const R1 = r1, R2 = r2 + 1, C1 = c1, C2 = c2 + 1;
  const zLo = v.zLo, zHi = v.zHi;
  const parts = [];

  /* 玻璃外殼：後面的邊用虛線，前面的邊用實線 */
  const shaftTop = v.kind === '電梯' ? zHi + 1 : zHi + 0.35;
  const line = (a, b, cls) => { const [x1,y1] = P(...a), [x2,y2] = P(...b);
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="${cls}"></line>`; };
  parts.push(`<polygon points="${f([[R1,C1,zLo],[R1,C2,zLo],[R2,C2,zLo],[R2,C1,zLo]].map(q=>P(...q)))}" class="v-floor"></polygon>`);
  parts.push(line([R1,C1,zLo],[R1,C1,shaftTop],'v-back'), line([R1,C1,zLo],[R1,C2,zLo],'v-back'), line([R1,C1,zLo],[R2,C1,zLo],'v-back'));
  for(let z = zLo + 1; z <= zHi; z++){
    parts.push(`<polyline points="${f([[R2,C1,z],[R2,C2,z],[R1,C2,z]].map(q=>P(...q)))}" class="v-level"></polyline>`);
  }

  if(v.kind === '電梯'){
    /* 電梯車廂：從出發樓層移到目的樓層，停一下再重來 */
    const ins = 0.18, h = 0.82;
    const car = box(R1+ins, R2-ins, C1+ins, C2-ins, v.zFrom, v.zFrom + h, 'v-car');
    const [dx1, dy1] = P((R1+R2)/2, C2-ins, v.zFrom), [, dy2] = P((R1+R2)/2, C2-ins, v.zFrom + h);
    const dy = -(v.zTo - v.zFrom) * ZS;
    const dur = Math.max(2.4, 1.2 + Math.abs(v.zTo - v.zFrom) * 0.7).toFixed(1);
    parts.push(`<g class="v-cargroup">${car}
      <line x1="${dx1.toFixed(1)}" y1="${(dy1-0.5).toFixed(1)}" x2="${dx1.toFixed(1)}" y2="${(dy2+1).toFixed(1)}" class="v-door"></line>
      <animateTransform attributeName="transform" type="translate" dur="${dur}s" repeatCount="indefinite"
        values="0 0;0 0;0 ${dy.toFixed(1)};0 ${dy.toFixed(1)}" keyTimes="0;0.18;0.78;1"
        calcMode="spline" keySplines="0 0 1 1;0.45 0 0.55 1;0 0 1 1"></animateTransform></g>`);
  } else {
    /* 折返樓梯：每層兩段，中間有平台；沿著長邊上下 */
    const alongR = (R2 - R1) >= (C2 - C1);
    const U1 = alongR ? R1 : C1, U2 = alongR ? R2 : C2;      // 梯段方向
    const V1 = alongR ? C1 : R1, V2 = alongR ? C2 : R2;      // 橫向（分成兩條）
    const Vm = (V1 + V2) / 2;
    const land = Math.min(1, (U2 - U1) * 0.25);
    const uA = U1 + land, uB = U2 - land;                     // 梯段起訖
    const N = 6;
    const pieces = [];
    const addBox = (u1, u2, va, vb, za, zb, cls) => {
      const [ra, rb, ca, cb] = alongR ? [u1, u2, va, vb] : [va, vb, u1, u2];
      pieces.push({d: (ra+rb)/2 + (ca+cb)/2 + 2.7*zb, svg: box(ra, rb, ca, cb, za, zb, cls)});
    };
    for(let z = zLo; z < zHi; z++){
      for(let i = 0; i < N; i++){
        /* 第一段：靠 V1 那條，從近端 uB 往遠端 uA 爬半層 */
        const t = (uB - uA) / N;
        const zt1 = z + 0.5 * (i + 1) / N;
        addBox(uB - t*(i+1), uB - t*i, V1, Vm, zt1 - 0.5/N, zt1, 'v-step');
        /* 第二段：靠 V2 那條，從遠端 uA 往近端 uB 再爬半層 */
        const zt2 = z + 0.5 + 0.5 * (i + 1) / N;
        addBox(uA + t*i, uA + t*(i+1), Vm, V2, zt2 - 0.5/N, zt2, 'v-step');
      }
      addBox(U1, uA, V1, V2, z + 0.5 - 0.06, z + 0.5, 'v-landing');       // 中間平台
      addBox(uB, U2, V1, V2, z + 1 - 0.06, z + 1, 'v-landing');           // 樓層平台
    }
    pieces.sort((a, b) => a.d - b.d);
    pieces.forEach(p => parts.push(p.svg));
  }

  /* 前面的外殼邊線 */
  parts.push(`<polygon points="${f([[R1,C1,shaftTop],[R1,C2,shaftTop],[R2,C2,shaftTop],[R2,C1,shaftTop]].map(q=>P(...q)))}" class="v-glass-top"></polygon>`);
  parts.push(`<polygon points="${f([[R2,C1,zLo],[R2,C2,zLo],[R2,C2,shaftTop],[R2,C1,shaftTop]].map(q=>P(...q)))}" class="v-glass"></polygon>`);
  parts.push(`<polygon points="${f([[R1,C2,zLo],[R2,C2,zLo],[R2,C2,shaftTop],[R1,C2,shaftTop]].map(q=>P(...q)))}" class="v-glass"></polygon>`);
  return `<g class="vshaft">${parts.join('')}</g>`;
}

function polysOverlap(A, B){
  for(const poly of [A, B]){
    for(let i = 0; i < poly.length; i++){
      const [x1,y1] = poly[i], [x2,y2] = poly[(i+1) % poly.length];
      const nx = y1 - y2, ny = x2 - x1;
      let aMin=Infinity, aMax=-Infinity, bMin=Infinity, bMax=-Infinity;
      A.forEach(([x,y])=>{ const v = x*nx + y*ny; aMin=Math.min(aMin,v); aMax=Math.max(aMax,v); });
      B.forEach(([x,y])=>{ const v = x*nx + y*ny; bMin=Math.min(bMin,v); bMax=Math.max(bMax,v); });
      if(aMax <= bMin + 1e-6 || bMax <= aMin + 1e-6) return false;
    }
  }
  return true;
}

function drawMassing(legs, target, via){
  const base = MAPS[D.baseGrid];
  const CELL = 4.6, ZS = CELL * 2.7;              // 格寬、每層高（像素）
  const R0 = 1, C0 = 1, R1 = base.maxr, C1 = base.maxc;
  const P = (r, c, z) => [ (c - r) * MS_COS * CELL, (c + r) * MS_SIN * CELL - z * ZS ];

  const tops = buildTopFloor();
  const faces = [];      // {depth, svg}

  /* 地面 */
  const ground = [[R0,C0],[R0,C1+1],[R1+1,C1+1],[R1+1,C0]].map(([r,c])=>P(r,c,0));

  /* 每棟建築：依 RLE 列區間擠出，只畫朝觀察者的南面、東面與頂面 */
  for(const [name, runs] of Object.entries(D.build)){
    const H = tops[name] || 1;
    const set = new Set();
    runs.forEach(([r,a,b]) => { for(let c=a;c<=b;c++) set.add(r*256+c); });
    const has = (r,c) => set.has(r*256+c);
    const isTarget = target && target.bldg === name;
    const tone = isTarget ? 'tgt' : 'std';
    const pts = arr => arr.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');

    /* 頂面：每列一塊但不描邊，外輪廓另外畫一次，屋頂才不會有條紋 */
    runs.forEach(([r,a,b])=>{
      const tp = [[r,a],[r,b+1],[r+1,b+1],[r+1,a]].map(([rr,cc])=>P(rr,cc,H));
      faces.push({d: r + (a+b)/2 + 1.0, z: H, b: name, poly: tp, front: (rd,cd) => r + 0.5 > rd, svg:
        `<polygon points="${pts(tp)}"
          class="m-top m-${tone}"></polygon>`});
    });

    /* 南面：沿欄方向把連續格子合成一面 */
    runs.forEach(([r,a,b])=>{
      let s = null;
      for(let c = a; c <= b + 1; c++){
        const open = c <= b && !has(r+1, c);
        if(open && s === null) s = c;
        if((!open || c === b+1) && s !== null){
          const e = open ? c : c - 1;
          const sp = [[r+1,s,0],[r+1,e+1,0],[r+1,e+1,H],[r+1,s,H]].map(([rr,cc,zz])=>P(rr,cc,zz));
          let lines = '';
          for(let f = 1; f < H && !BUILD_HEIGHT[name]; f++){
            const [x1,y1] = P(r+1,s,f), [x2,y2] = P(r+1,e+1,f);
            lines += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="m-floorline"></line>`;
          }
          faces.push({d: r + 1 + (s+e)/2 + 0.8, z: 0, b: name, poly: sp, front: (rd,cd) => r + 1 > rd, svg:
            `<polygon points="${pts(sp)}" class="m-side m-south m-${tone}"></polygon>${lines}`});
          s = null;
        }
      }
    });

    /* 東面：先找出所有外露位置，再沿列方向把連續的合成一面 */
    const eastCols = new Map();
    runs.forEach(([r,a,b])=>{
      for(let c = a; c <= b; c++) if(!has(r, c+1)){
        if(!eastCols.has(c+1)) eastCols.set(c+1, []);
        eastCols.get(c+1).push(r);
      }
    });
    eastCols.forEach((rows, cc)=>{
      rows.sort((x,y)=>x-y);
      let s = rows[0], p = rows[0];
      const flush = (r1, r2)=>{
        const ep = [[r1,cc,0],[r2+1,cc,0],[r2+1,cc,H],[r1,cc,H]].map(([rr,c2,zz])=>P(rr,c2,zz));
        let lines = '';
        for(let f = 1; f < H && !BUILD_HEIGHT[name]; f++){
          const [x1,y1] = P(r1,cc,f), [x2,y2] = P(r2+1,cc,f);
          lines += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="m-floorline"></line>`;
        }
        faces.push({d: (r1+r2)/2 + cc + 0.9, z: 0, b: name, poly: ep, front: (rd,cd) => cc > cd, svg:
          `<polygon points="${pts(ep)}" class="m-side m-east m-${tone}"></polygon>${lines}`});
      };
      for(let i = 1; i < rows.length; i++){
        if(rows[i] === p + 1){ p = rows[i]; continue; }
        flush(s, p); s = p = rows[i];
      }
      flush(s, p);
    });

    /* 屋頂外輪廓 */
    const edge = [];
    set.forEach(k=>{
      const r = k >> 8, c = k & 255;
      if(!has(r-1,c)) edge.push([P(r,c,H),   P(r,c+1,H)]);
      if(!has(r+1,c)) edge.push([P(r+1,c,H), P(r+1,c+1,H)]);
      if(!has(r,c-1)) edge.push([P(r,c,H),   P(r+1,c,H)]);
      if(!has(r,c+1)) edge.push([P(r,c+1,H), P(r+1,c+1,H)]);
    });
    let maxD = 0;
    runs.forEach(([r,a,b]) => { maxD = Math.max(maxD, r + b); });
    faces.push({d: maxD + 2, z: H, b: name, svg:
      `<path d="${edge.map(([p1,p2])=>'M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+'L'+p2[0].toFixed(1)+' '+p2[1].toFixed(1)).join('')}"
        class="m-roofline"></path>`});

    /* 建築名稱：標在屋頂中心 */
    let sr=0, sc=0, n=0;
    runs.forEach(([r,a,b])=>{ sr += r*(b-a+1); sc += (a+b)/2*(b-a+1); n += (b-a+1); });
    const [lx, ly] = P(sr/n + 0.5, sc/n + 0.5, H);
    faces.push({d: 1e6, z: H, label: true, svg:
      `<text x="${lx.toFixed(1)}" y="${(ly+6).toFixed(1)}" text-anchor="middle" class="m-name ${isTarget?'m-name-tgt':''}">${name}</text>`});
  }

  /* 連城路與校門口：路面畫在地上，校門畫成兩根門柱加橫樑 */
  const groundExtra = [];
  const fx = pts => pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
  const road = base.blocks.find(b => b.label === '連城路');
  if(road){
    const {r1, c1, r2, c2} = road;
    groundExtra.push(`<polygon points="${fx([[r1,c1],[r1,c2+1],[r2+1,c2+1],[r2+1,c1]].map(([r,c]) => P(r,c,0)))}" class="m-road"></polygon>`);
    const edge = (c, cls) => { const [x1,y1] = P(r1,c,0), [x2,y2] = P(r2+1,c,0);
      return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="${cls}"></line>`; };
    groundExtra.push(edge(c1 + 0.6, 'm-road-edge'), edge(c2 + 0.4, 'm-road-edge'), edge((c1 + c2 + 1) / 2, 'm-road-mid'));
    /* 路名像漆在路面上：文字的橫軸沿著馬路、縱軸沿著路寬 */
    const [lx, ly] = P(r1 + (r2 + 1 - r1) * 0.3, (c1 + c2 + 1) / 2, 0);
    groundExtra.push(`<text transform="matrix(${MS_COS.toFixed(3)} ${(-MS_SIN).toFixed(3)} ${MS_COS.toFixed(3)} ${MS_SIN.toFixed(3)} ${lx.toFixed(1)} ${ly.toFixed(1)})"
      text-anchor="middle" dominant-baseline="central" class="m-road-name">連城路</text>`);
  }
  const gate = base.blocks.find(b => b.label === '校門口');
  if(gate){
    const {r1, c1, r2, c2} = gate;
    groundExtra.push(`<polygon points="${fx([[r1,c1],[r1,c2+1],[r2+1,c2+1],[r2+1,c1]].map(([r,c]) => P(r,c,0)))}" class="m-plaza"></polygon>`);
    const cube = (ra, rb, ca, cb, za, zb, d) => faces.push({d, z: zb, svg:
      `<polygon points="${fx([[ra,cb,za],[rb,cb,za],[rb,cb,zb],[ra,cb,zb]].map(q => P(...q)))}" class="m-side m-east m-gate"></polygon>` +
      `<polygon points="${fx([[rb,ca,za],[rb,cb,za],[rb,cb,zb],[rb,ca,zb]].map(q => P(...q)))}" class="m-side m-south m-gate"></polygon>` +
      `<polygon points="${fx([[ra,ca,zb],[ra,cb,zb],[rb,cb,zb],[rb,ca,zb]].map(q => P(...q)))}" class="m-side m-top m-gate"></polygon>`});
    const gc1 = c2 - 0.4, gc2 = c2 + 0.9;            // 門柱貼著馬路那一側
    const H = 1.35;
    cube(r1, r1 + 1.4, gc1, gc2, 0, H, r1 + c2 + 2);
    cube(r2 - 0.4, r2 + 1, gc1, gc2, 0, H, r2 + c2 + 2.5);
    cube(r1, r2 + 1, gc1 + 0.2, gc2 - 0.2, H - 0.22, H + 0.05, r2 + c2 + 2.6);   // 橫樑
    const [tx, ty] = P((r1 + r2 + 1) / 2, gc2, H + 0.05);
    faces.push({d: 1e6, z: 9, label: true, svg:
      `<text x="${tx.toFixed(1)}" y="${(ty - 6).toFixed(1)}" text-anchor="middle" class="m-name">校門口</text>`});
  }

  faces.sort((a,b) => a.d - b.d || a.z - b.z);

  /* 這次路線用到的樓梯／電梯：在第二段起點旁邊、種類相同的那一座 */
  let vert = null;
  if(via && legs.length > 1){
    const g2 = MAPS[legs[1].grid], [pr, pc] = legs[1].path[0];
    let bd = Infinity;
    g2.blocks.forEach(b => {
      if(!b.label || b.label.indexOf(via) < 0) return;
      const dr = Math.max(b.r1 - pr, 0, pr - b.r2), dc = Math.max(b.c1 - pc, 0, pc - b.c2);
      const d = dr*dr + dc*dc;
      if(d < bd){ bd = d; vert = b; }
    });
    if(vert && bd > 9) vert = null;
    if(vert){
      const za = (D.gridFloor[legs[0].grid] || 1) - 1, zb = (D.gridFloor[legs[1].grid] || 1) - 1;
      vert = {b: vert, kind: via, zFrom: za, zTo: zb, zLo: Math.min(za, zb), zHi: Math.max(za, zb),
              bldg: Object.keys(D.build).find(n => D.build[n].some(([r,a,b2]) => r === vert.r1 && a <= vert.c1 && b2 >= vert.c1))};
    }
  }

  /* 擋住目的地（或樓梯、電梯）的大樓變半透明：螢幕上重疊、而且位置在它前面 */
  const ghost = new Set();
  const focus = [];
  if(target && target.rects && target.rects.length){
    const zf = (target.floor || 1) - 1;
    destRects(target).forEach(rc => focus.push({rc, z0: zf, z1: zf + 1, own: target.bldg}));
  }
  if(vert) focus.push({rc: [vert.b.r1, vert.b.c1, vert.b.r2, vert.b.c2], z0: vert.zLo, z1: vert.zHi + 1, own: vert.bldg});
  {
    focus.forEach(({rc: [r1,c1,r2,c2], z0: zLo, z1: zUp, own})=>{
      const rd = (r1 + r2 + 1) / 2, cd = (c1 + c2 + 1) / 2;
      const boxPolys = [
        [[r1,c1,zUp],[r1,c2+1,zUp],[r2+1,c2+1,zUp],[r2+1,c1,zUp]],
        [[r2+1,c1,zLo],[r2+1,c2+1,zLo],[r2+1,c2+1,zUp],[r2+1,c1,zUp]],
        [[r1,c2+1,zLo],[r2+1,c2+1,zLo],[r2+1,c2+1,zUp],[r1,c2+1,zUp]]
      ].map(q => q.map(([r,c,z]) => P(r,c,z)));
      faces.forEach(f=>{
        if(!f.poly || f.b === own || ghost.has(f.b)) return;
        if(!f.front(rd, cd)) return;
        if(boxPolys.some(q => polysOverlap(q, f.poly))) ghost.add(f.b);
      });
    });
  }

  /* 路線：1F 在地面、樓上在該層高度；跨樓層用垂直線接起來 */
  const over = [];
  legs.forEach((leg, i)=>{
    const z = (D.gridFloor[leg.grid] || 1) - 1;
    const pts = leg.path.map(([r,c]) => P(r+0.5, c+0.5, z).map(v=>v.toFixed(1)).join(',')).join(' ');
    over.push(`<polyline points="${pts}" class="m-route rline"></polyline>`);
    if(i > 0 && vert){
      /* 樓梯間／電梯井在目的地方塊之後才畫，才不會被紅色蓋住 */
    } else if(i > 0){
      const a = legs[i-1], za = (D.gridFloor[a.grid] || 1) - 1;
      const pa = a.path[a.path.length-1], pb = leg.path[0];
      const [x1,y1] = P(pa[0]+0.5, pa[1]+0.5, za), [x2,y2] = P(pb[0]+0.5, pb[1]+0.5, z);
      over.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="m-rise"></line>`);
    }
  });

  /* 目的地：在正確的樓層高度畫一個發光的方塊 */
  if(target){
    const zf = (target.floor || 1) - 1;
    const DR = destRects(target).slice().sort((a,b)=>(a[0]+a[1])-(b[0]+b[1]));
    const touches = (side, [r1,c1,r2,c2]) => DR.some(([a1,b1,a2,b2]) => side === 's'
      ? a1 === r2+1 && b1 <= c2 && b2 >= c1
      : b1 === c2+1 && a1 <= r2 && a2 >= r1);
    DR.forEach(([r1,c1,r2,c2])=>{
      const hideS = touches('s', [r1,c1,r2,c2]), hideE = touches('e', [r1,c1,r2,c2]);
      /* 看得到的 9 條邊：頂面 4 條、前方 3 條直邊、底部前方 2 條；後方 3 條被擋住不畫 */
      const edges = (z0, z1)=>{
        const p = (r,c,z) => P(r,c,z).map(v=>v.toFixed(1)).join(' ');
        const T1 = p(r1,c1,z1), T2 = p(r1,c2+1,z1), T3 = p(r2+1,c2+1,z1), T4 = p(r2+1,c1,z1);
        const B2 = p(r1,c2+1,z0), B3 = p(r2+1,c2+1,z0), B4 = p(r2+1,c1,z0);
        let d = `M${T1}L${T2}L${T3}L${T4}Z`;
        if(!hideS) d += `M${T4}L${B4}L${B3}L${T3}`;
        if(!hideE) d += `M${B3}L${B2}L${T2}`;
        return `<path d="${d}" class="m-dest-edge"></path>`;
      };
      const box = (z0, z1)=>{
        const top = [[r1,c1],[r1,c2+1],[r2+1,c2+1],[r2+1,c1]].map(([r,c])=>P(r,c,z1));
        const s = [[r2+1,c1,z0],[r2+1,c2+1,z0],[r2+1,c2+1,z1],[r2+1,c1,z1]].map(([r,c,z])=>P(r,c,z));
        const e = [[r1,c2+1,z0],[r2+1,c2+1,z0],[r2+1,c2+1,z1],[r1,c2+1,z1]].map(([r,c,z])=>P(r,c,z));
        const f = pts => pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
        return (hideS ? '' : `<polygon points="${f(s)}" class="m-dest-s desthi"></polygon>`) +
               (hideE ? '' : `<polygon points="${f(e)}" class="m-dest-e desthi"></polygon>`) + `
                <polygon points="${f(top)}" class="m-dest-t desthi"></polygon>` + edges(z0, z1);
      };
      over.push(box(zf, zf + 1));
    });
    const lp = legs[legs.length-1].path.slice(-1)[0];
    const [tx,ty] = P(lp[0]+0.5, lp[1]+0.5, zf);
    over.push(`<circle class="pulse" cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="10" fill="var(--mark)"></circle>
               <circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="4.6" fill="var(--mark)" stroke="var(--panel)" stroke-width="2"></circle>`);
  }
  if(vert){
    const shaft = drawVertical(vert, P, ZS);
    const at = over.findIndex(x => x.indexOf('class="pulse"') >= 0);
    if(at >= 0) over.splice(at, 0, shaft); else over.push(shaft);
  }
  const fp = legs[0].path[0], zf0 = (D.gridFloor[legs[0].grid] || 1) - 1;
  const [sx,sy] = P(fp[0]+0.5, fp[1]+0.5, zf0);
  over.push(`<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="5.5" fill="var(--ink)" stroke="var(--panel)" stroke-width="2.2"></circle>`);

  /* 畫布範圍 */
  const allPts = [...ground];
  const maxH = Math.max(...Object.values(tops));
  [[R0,C0],[R0,C1+1],[R1+1,C1+1],[R1+1,C0]].forEach(([r,c]) => allPts.push(P(r,c,maxH)));
  let X0=Infinity, Y0=Infinity, X1=-Infinity, Y1=-Infinity;
  allPts.forEach(([x,y])=>{ X0=Math.min(X0,x); Y0=Math.min(Y0,y); X1=Math.max(X1,x); Y1=Math.max(Y1,y); });
  const M = 22, W = X1-X0+M*2, H = Y1-Y0+M*2;

  return `<div class="mapbox"><svg viewBox="${(X0-M).toFixed(0)} ${(Y0-M).toFixed(0)} ${W.toFixed(0)} ${H.toFixed(0)}"
    width="${W.toFixed(0)}" height="${H.toFixed(0)}" role="img" aria-label="校園立體圖">
    <polygon points="${ground.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" class="m-ground"></polygon>
    ${groundExtra.join('')}
    ${faces.map(f => ghost.has(f.b) && !f.label ? `<g class="m-ghost">${f.svg}</g>` : f.svg).join('')}
    ${over.join('')}
  </svg></div>`;
}

const MAPS = D.grids;          // drawMap 沿用舊名
const PLACES = D.places;
const R = makeRouter(D);
const byKey = {};
PLACES.forEach(p => byKey[p.key] = p);

let fromKey = (D.starts[0] && D.starts[0].key) || PLACES[0].key;
let toKey   = (PLACES.find(p => p.label === '303') || PLACES[1] || PLACES[0]).key;
let routeMode = 'normal';
let viewMode  = 'plan';        // plan＝平面圖（預設）、iso＝立體圖
const MODE_LABEL = {normal:'標準路線', lift:'優先搭電梯', indoor:'少走戶外'};

const norm = s => s.trim().toLowerCase().replace(/\s+/g,'');
function search(term, limit){
  const t = norm(term);
  if(!t) return [];
  return PLACES.filter(p =>
    norm(p.label).includes(t) || norm(p.name).includes(t) ||
    (p.alias || []).some(a => norm(a).includes(t)) ||
    norm(p.bldg).includes(t)).slice(0, limit || 7);
}

/* 同一組起訖與走法只算一次 */
const cache = new Map();
function routeFor(m){
  const ck = fromKey + '|' + toKey + '|' + m;
  if(cache.has(ck)) return cache.get(ck);
  const f = byKey[fromKey], t = byKey[toKey];
  if(!f || !t) return null;
  const r = R.route({grid:f.grid, rects:f.rects, gate:!!f.gate}, t, m);
  cache.set(ck, r);
  return r;
}
function modeAvailable(m){
  if(m === 'normal') return true;
  const a = routeFor(m), b = routeFor('normal');
  if(!a || !b) return false;
  return JSON.stringify(a.legs.map(l=>l.path)) !== JSON.stringify(b.legs.map(l=>l.path));
}

const SEARCH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4.2-4.2"></path></svg>';
const QUICK_TO = ['活動中心', '自主學習空間', '行政大樓六樓會議室'];

function pickerHTML(id, no, title, curKey, chips, ph){
  const cur = byKey[curKey];
  return `
    <div class="phead">
      <span class="pno">${no}</span>
      <span class="ptitle">${title}</span>
      <span class="pnow">${cur ? cur.name : '尚未選擇'}</span>
    </div>
    <div class="pfield">${SEARCH_ICON}
      <input type="text" inputmode="search" autocomplete="off"
             id="${id}Input" placeholder="${ph}" aria-label="${title}">
    </div>
    <div id="${id}List"></div>
    <div class="pchips">${chips.map(c =>
      `<button type="button" data-key="${c.key}"
        class="${c.key === curKey ? 'on' : ''}">${c.name}</button>`).join('')}</div>`;
}

function bindPicker(prefix, boxId, setKey){
  const box   = document.getElementById(boxId);
  const input = document.getElementById(prefix + 'Input');
  const list  = document.getElementById(prefix + 'List');
  if(!box || !input || !list) return;
  box.querySelectorAll('[data-key]').forEach(b=>{
    b.onclick = ()=>{ setKey(b.dataset.key); render(); };
  });
  input.addEventListener('input', ()=>{
    const q = input.value;
    if(!q.trim()){ list.innerHTML = ''; return; }
    const hits = search(q);
    if(!hits.length){
      list.innerHTML = `<div class="plist"><div class="pnone">找不到「${q}」</div></div>`;
      return;
    }
    list.innerHTML = `<ul class="plist">${hits.map((h,i)=>
      `<li data-i="${i}"><span class="pn">${h.name}</span>
        <span class="pl">${h.bldg}${h.floor ? ' ' + h.floor + 'F' : ''}</span></li>`).join('')}</ul>`;
    list.querySelectorAll('li').forEach(li=>{
      li.onclick = ()=>{ setKey(hits[+li.dataset.i].key); render(); };
    });
  });
  input.addEventListener('keydown', e=>{
    if(e.key === 'Enter' && !e.isComposing){
      const hits = search(input.value);
      if(hits.length){ setKey(hits[0].key); render(); }
    }
  });
}

function renderPickers(){
  const fromChips = D.starts.map(s => ({key:s.key, name:s.name}));
  const toChips = QUICK_TO.map(n=>{
    const h = search(n, 1);
    return h.length ? {key:h[0].key, name:h[0].name} : null;
  }).filter(Boolean);
  document.getElementById('pickFrom').innerHTML =
    pickerHTML('from', 1, '出發點', fromKey, fromChips, '或直接輸入地點');
  document.getElementById('pickTo').innerHTML =
    pickerHTML('to', 2, '目的地', toKey, toChips, '輸入班級或地點，例如 303');
  bindPicker('from', 'pickFrom', k => { fromKey = k; });
  bindPicker('to',   'pickTo',   k => { toKey   = k; });
}

function renderModes(){
  const btns = ['normal','lift','indoor'].map(m=>{
    const ok = modeAvailable(m);
    return `<button type="button" data-mode="${m}" ${ok ? '' : 'disabled'}
      class="${routeMode === m ? 'on' : ''}">${MODE_LABEL[m]}</button>`;
  }).join('');
  const views = [['plan','平面圖'],['iso','立體圖']].map(([v,t])=>
    `<button type="button" data-view="${v}" class="${viewMode === v ? 'on' : ''}">${t}</button>`).join('');
  document.getElementById('viewctl').innerHTML =
    `<div class="ctlrow"><span class="vl">走法</span>${btns}</div>
     <div class="ctlrow"><span class="vl">顯示</span>${views}</div>`;
  const vc = document.getElementById('viewctl');
  vc.querySelectorAll('[data-mode]').forEach(b=>{
    b.onclick = ()=>{ if(!b.disabled){ routeMode = b.dataset.mode; render(); } };
  });
  vc.querySelectorAll('[data-view]').forEach(b=>{
    b.onclick = ()=>{ viewMode = b.dataset.view; render(); };
  });
}

function render(){
  renderPickers();
  renderModes();
  const f = byKey[fromKey], t = byKey[toKey];
  const el = document.getElementById('result');
  const Rt = routeFor(routeMode) || routeFor('normal');
  if(!Rt){ el.innerHTML = '<p class="pnone">這兩個地點之間算不出路線。</p>'; return; }

  const isNum = /^\d{3}$/.test(t.label);
  const blocks = [];
  blocks.push(`
    <div class="dest">
      ${isNum ? `<div class="dest-num">${t.label}</div>` : ''}
      <div class="dest-txt">
        <div class="dest-name">${t.name}</div>
        <div class="dest-where">${t.bldg} ${t.floor} 樓　·　從 ${f.name} 出發</div>
      </div>
    </div>`);

  if(Rt.same){
    blocks.push(`<section class="vstep"><span class="stage-n">提醒</span>
      <span class="vtext">你已經在 <b>${t.name}</b></span></section>`);
  }
  if(viewMode === 'iso'){
    blocks.push(`
      <section class="stage">
        <div class="stage-head">
          <span class="stage-n">路線</span>
          <span class="stage-t">${f.name} → ${t.name}</span>
          <button class="zoombtn" type="button" data-zoom>放大</button>
        </div>
        ${drawMassing(Rt.legs, t, Rt.via)}
      </section>`);
    if(Rt.legs.length > 1 && Rt.via){
      const up = t.floor > (D.gridFloor[Rt.legs[0].grid] || 1);
      const verb = Rt.via === '電梯' ? '搭電梯' : (up ? '上樓梯' : '下樓梯');
      const icon = Rt.via === '電梯'
        ? '<rect x="4.5" y="2.8" width="15" height="18.4" rx="1.8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 6.4l-2.9 4h5.8z" fill="currentColor"/><path d="M12 17.6l-2.9-4h5.8z" fill="currentColor"/>'
        : '<path d="M2.5 21h4.6v-4.4h4.6v-4.4h4.6V7.8h4.8" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>';
      blocks.push(`
        <section class="vstep">
          <span class="stage-n">中途</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg>
          <span class="vtext">${verb}到 <b>${t.floor} 樓</b></span>
        </section>`);
    }
    el.innerHTML = blocks.join('');
    bindZoom(el);
    return;
  }

  const many = Rt.legs.length > 1;
  let no = 0;
  Rt.legs.forEach((leg, i)=>{
    const last = (i === Rt.legs.length - 1);
    no++;
    const tag = many ? ('STEP ' + no) : '路線';
    let title;
    if(!many)        title = `${f.name} → ${t.name}`;
    else if(i === 0) title = `${f.name} → ${Rt.via || '樓梯'}`;
    else             title = `${t.bldg} ${t.floor} 樓　→ ${t.name}`;
    blocks.push(`
      <section class="stage">
        <div class="stage-head">
          <span class="stage-n">${tag}</span>
          <span class="stage-t">${title}</span>
          <button class="zoombtn" type="button" data-zoom>放大</button>
        </div>
        ${drawMap(leg.grid, leg.path, last ? t : null)}
      </section>`);
    if(!last && Rt.via){
      no++;
      const up = t.floor > (D.gridFloor[Rt.legs[0].grid] || 1);
      const verb = Rt.via === '電梯' ? '搭電梯' : (up ? '上樓梯' : '下樓梯');
      const icon = Rt.via === '電梯'
        ? '<rect x="4.5" y="2.8" width="15" height="18.4" rx="1.8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 6.4l-2.9 4h5.8z" fill="currentColor"/><path d="M12 17.6l-2.9-4h5.8z" fill="currentColor"/>'
        : '<path d="M2.5 21h4.6v-4.4h4.6v-4.4h4.6V7.8h4.8" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>';
      blocks.push(`
        <section class="vstep">
          <span class="stage-n">STEP ${no}</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg>
          <span class="vtext">${verb}到 <b>${t.floor} 樓</b></span>
        </section>`);
    }
  });
  el.innerHTML = blocks.join('');
  bindZoom(el);
}

function bindZoom(el){
  el.querySelectorAll('[data-zoom]').forEach(btn=>{
    btn.onclick = ()=>{
      const stage = btn.closest('.stage'), box = stage.querySelector('.mapbox');
      const on = box.classList.toggle('zoom');
      btn.classList.toggle('on', on);
      btn.textContent = on ? '縮小' : '放大';
      if(on){
        const hi = box.querySelector('.desthi');
        if(hi){
          const bb = hi.getBBox(), svg = box.querySelector('svg');
          const k = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width;
          box.scrollLeft = (bb.x + bb.width/2) * k - box.clientWidth/2;
          box.scrollTop  = (bb.y + bb.height/2) * k - box.clientHeight/2;
        }
      } else { box.scrollLeft = 0; box.scrollTop = 0; }
    };
  });
}

/* 深色／淺色：預設淺色，使用者選過就記在這台裝置 */
const THEME_ICON = {
  dark:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>'
};
function applyTheme(t){
  const root = document.documentElement;
  if(root && root.classList) root.classList.toggle('theme-dark', t === 'dark');
  const btn = document.getElementById('themeBtn');
  if(btn) btn.innerHTML = t === 'dark' ? THEME_ICON.light + '淺色' : THEME_ICON.dark + '深色';
}
let theme = 'light';
try { if(localStorage.getItem('chshs-nav-theme') === 'dark') theme = 'dark'; } catch(e){}
applyTheme(theme);
{
  const btn = document.getElementById('themeBtn');
  if(btn) btn.onclick = () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    applyTheme(theme);
    try { localStorage.setItem('chshs-nav-theme', theme); } catch(e){}
  };
}

render();
</script>
</body>
